<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agendamento Online</title><link rel="stylesheet" href="style.css"><style>body{background:#f5f6f8}.booking{max-width:760px;margin:30px auto;padding:20px}.booking-card{background:#fff;border-radius:24px;padding:28px;box-shadow:0 18px 55px rgba(0,0,0,.08)}.booking-brand{text-align:center}.booking-logo{max-width:100px;max-height:80px;object-fit:contain}.booking-title{margin:10px 0 5px}.booking-sub{color:#64748b;margin:0 0 22px}.booking-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.booking label{display:block;font-weight:700;color:#334155}.booking input,.booking select,.booking textarea{width:100%;margin-top:7px;padding:12px;border:1px solid #dbe2ea;border-radius:11px;box-sizing:border-box}.booking textarea{min-height:90px;resize:vertical}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:8px}.slot{padding:11px;border:1px solid #cbd5e1;background:#fff;border-radius:10px;cursor:pointer;font-weight:800}.slot.selected{background:#111827;color:#fff;border-color:#111827}.booking button.primary{width:100%;border:0;border-radius:12px;padding:13px;background:#111827;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.booking button.primary:disabled{opacity:.55}.booking-msg{margin-top:14px;padding:12px;border-radius:11px;display:none}.booking-msg.show{display:block;background:#f1f5f9}.booking-msg.ok{background:#ecfdf5;color:#166534}.booking-msg.err{background:#fef2f2;color:#991b1b}.loading{text-align:center;color:#64748b}@media(max-width:620px){.booking-grid{grid-template-columns:1fr}.slots{grid-template-columns:repeat(3,1fr)}.booking-card{padding:20px}}</style></head><body><div class="booking"><div class="booking-card"><div id="loading" class="loading">Carregando agendamento...</div><div id="content" style="display:none"><div class="booking-brand"><img id="logo" class="booking-logo" style="display:none"><h1 id="nome" class="booking-title"></h1><p id="descricao" class="booking-sub"></p></div><div class="booking-grid"><label>Serviço<select id="servico"></select></label><label>Data<input id="data" type="date"></label></div><div style="margin-top:14px"><label>Horários disponíveis</label><div id="slots" class="slots"></div></div><div class="booking-grid" style="margin-top:18px"><label>Nome *<input id="clienteNome" placeholder="Seu nome"></label><label>WhatsApp *<input id="telefone" placeholder="(00) 00000-0000"></label><label>E-mail<input id="email" type="email" placeholder="voce@email.com"></label></div><label style="margin-top:14px">Observação<textarea id="obs" placeholder="Alguma informação para o atendimento?"></textarea></label><button id="confirmar" class="primary" style="margin-top:16px">Confirmar agendamento</button><div id="msg" class="booking-msg"></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="booking.js"></script></body></html>
